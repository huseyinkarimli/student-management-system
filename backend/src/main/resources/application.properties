spring.application.name=student-management

# ==================== H2 DATABASE (local dev: mvn spring-boot:run) ====================
# Docker Compose overrides datasource via SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== H2 CONSOLE ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==================== MYSQL DATABASE (use Docker MySQL or host MySQL — uncomment when needed) ====================
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.url=jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=1234

# ==================== JPA CONFIGURATION ====================
# Dialect is derived from the JDBC URL (H2 locally, MySQL in Docker via env overrides).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== INITIAL DATA ====================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ==================== SERVER ====================
server.port=8080

# ==================== LOGGING ====================
logging.level.az.developia.studentmanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# ==================== ACTIVE PROFILE ====================
spring.profiles.active=development

# ==================== JWT SECRET KEYS ====================
# Uses environment variables in Docker, falls back to defaults for local development
# SECURITY: Change these in production using environment variables
jwt.secret=${JWT_SECRET:dttDdfdfGghgjjPjfdghhh3hhfgnmr4tc5hhjwTe2v32GelsdSHog5Hfpia3}
jwt.refresh.secret=${JWT_REFRESH_SECRET:dhhfgnmr4Rtc5hhjwTe2ttDdfdfGghgjjPjfdghhh3v32GelsdwdSHog5Hfpia3}

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ==================== EMAIL CONFIGURATION ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=huseyinkarimli.tech@gmail.com
spring.mail.password=my-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== RATE LIMITING ====================
rate.limit.capacity=5
rate.limit.tokens=5
rate.limit.refill.minutes=1

# ==================== MONGODB (AUDIT LOG - isolated from JPA/MySQL) ====================
# Uses environment variable in Docker, falls back to localhost for local development
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/student_audit}

# ==================== ADMIN ACCOUNT ====================
app.admin.username=admin
app.admin.password=Admin@1234

# ==================== SEEDER ====================
# Set to true in development to create test users
app.seeder.seed-test-data=true
