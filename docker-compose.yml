services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/student_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/student_audit
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - JWT_SECRET=${JWT_SECRET:-dttDdfdfGghgjjPjfdghhh3hhfgnmr4tc5hhjwTe2v32GelsdSHog5Hfpia3}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dhhfgnmr4Rtc5hhjwTe2ttDdfdfGghgjjPjfdghhh3v32GelsdwdSHog5Hfpia3}
    command: java -jar app.jar --spring.h2.console.settings.web-allow-others=true
    depends_on:
      - mongodb
    networks:
      - student-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - student-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - student-network

  # mysql:
  #   image: mysql:8.0
  #   ports:
  #     - "3306:3306"
