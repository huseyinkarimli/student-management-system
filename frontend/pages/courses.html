<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kurslar — EduCore SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/app.css"/>
  <script src="../js/app.js"></script>
  <script src="../js/layout.js"></script>
  <script>(function(){ const t=localStorage.getItem('theme'); if(t==='light') document.documentElement.setAttribute('data-theme','light'); })();</script>
  <style>
    .courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
    .cc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
    .cc:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
    .cc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
    .cc:nth-child(6n+1)::before{background:linear-gradient(90deg,#7b6ef6,#f06292);}
    .cc:nth-child(6n+2)::before{background:linear-gradient(90deg,#f06292,#f6c453);}
    .cc:nth-child(6n+3)::before{background:linear-gradient(90deg,#26c6da,#4caf82);}
    .cc:nth-child(6n+4)::before{background:linear-gradient(90deg,#f6c453,#7b6ef6);}
    .cc:nth-child(6n+5)::before{background:linear-gradient(90deg,#4caf82,#26c6da);}
    .cc:nth-child(6n+6)::before{background:linear-gradient(90deg,#ef5f5f,#f06292);}
    .cc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
    .cc-code{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--accent-dim);color:var(--accent);}
    .cc-actions{display:flex;gap:6px;}
    .cc-name{font-family:'Clash Display',sans-serif;font-size:16px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em;line-height:1.3;}
    .cc-desc{font-size:13px;color:var(--text2);margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;}
    .cc-meta{display:flex;gap:14px;}
    .cc-mi{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
    .cc-mi i{font-size:11px;}
    .enroll-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
    .enroll-row{display:flex;align-items:center;gap:8px;}
    .enroll-row select{flex:1;}
  </style>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-area">
    <div class="page-content">
      <div class="toolbar">
        <div class="search-wrap" style="max-width:300px">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="form-input" id="searchInp" placeholder="Kurs adı, kodu..." oninput="onSearch()"/>
        </div>
        <button class="btn btn-primary btn-sm admin-only" style="display:none" onclick="openAdd()"><i class="fa-solid fa-plus"></i> Yeni kurs</button>
      </div>
      <div class="courses-grid" id="courseGrid">
        ${Array(6).fill('<div class="cc"><div class="skeleton" style="width:70px;height:20px;margin-bottom:14px;"></div><div class="skeleton" style="width:80%;height:18px;margin-bottom:8px;"></div><div class="skeleton" style="width:90%;height:13px;margin-bottom:4px;"></div><div class="skeleton" style="width:60%;height:13px;"></div></div>').join('')}
      </div>
    </div>
    <div class="footer-credit">@ by Huseyin Karimli</div>
  </div>
</div>

<!-- COURSE MODAL -->
<div class="modal-overlay" id="courseModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="cModalTitle">Yeni kurs</span>
      <button class="modal-close" onclick="closeModal('courseModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="courseForm" onsubmit="submitCourse(event)">
      <input type="hidden" id="cId"/>
      <div class="form-group"><label class="form-label">Kursun adı *</label><input type="text" class="form-input" id="cName" required/></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Kurs kodu *</label><input type="text" class="form-input" id="cCode" placeholder="CS101" required/></div>
        <div class="form-group"><label class="form-label">Kredit *</label><input type="number" class="form-input" id="cCredits" placeholder="3" min="1" max="10" required/></div>
      </div>
      <div class="form-group"><label class="form-label">Təsvir</label><textarea class="form-input form-textarea" id="cDesc" placeholder="Kurs haqqında..."></textarea></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('courseModal')">Ləğv et</button>
        <button type="submit" class="btn btn-primary" id="cSubmit"><i class="fa-solid fa-check"></i> Saxla</button>
      </div>
    </form>
  </div>
</div>

<!-- ENROLL MODAL -->
<div class="modal-overlay" id="enrollModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Tələbə qeydiyyatı</span>
      <button class="modal-close" onclick="closeModal('enrollModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:18px">Kursa: <strong id="enrollCourseName"></strong></p>
    <div class="form-group">
      <label class="form-label">Tələbə seçin</label>
      <select class="form-input form-select" id="enrollStudentSel">
        <option value="">— Tələbə seçin —</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('enrollModal')">Ləğv et</button>
      <button class="btn btn-primary" onclick="doEnroll()"><i class="fa-solid fa-user-plus"></i> Qeydiyyat et</button>
    </div>
  </div>
</div>

<div id="toast-host" class="toast-host"></div>
<script>
document.getElementById('app').insertAdjacentHTML('afterbegin', renderSidebar('../', 'courses'));
document.querySelector('.main-area').insertAdjacentHTML('afterbegin', renderTopbar('Kurslar'));
initTheme(); if (!Auth.check()) throw ''; initSidebarUser();
bindModalClose('courseModal'); bindModalClose('enrollModal');

let allCourses = [], filtered = [], allStudents = [], enrollCourseId = null;

async function load() {
  try {
    allCourses = await api.courses.all();
    filtered = [...allCourses];
    if (Auth.isAdmin()) {
      document.querySelectorAll('.admin-only').forEach(e => e.style.display = '');
      allStudents = await api.students.all().catch(() => []);
    }
    render();
  } catch(e) { showToast(e.message || 'Xəta', 'error'); document.getElementById('courseGrid').innerHTML = '<div style="color:var(--text3);padding:40px;text-align:center">Məlumatlar yüklənəmdi</div>'; }
}

function onSearch() {
  const q = document.getElementById('searchInp').value.toLowerCase().trim();
  filtered = allCourses.filter(c => `${c.name||''} ${c.code||''}`.toLowerCase().includes(q));
  render();
}

function render() {
  if (!filtered.length) {
    document.getElementById('courseGrid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📚</div><div class="empty-title">Kurs tapılmadı</div><div class="empty-desc">Hələ heç bir kurs əlavə edilməyib.</div>${Auth.isAdmin()?'<button class="btn btn-primary" onclick="openAdd()"><i class="fa-solid fa-plus"></i> İlk kursu əlavə et</button>':''}</div>`;
    return;
  }
  document.getElementById('courseGrid').innerHTML = filtered.map(c => `
    <div class="cc">
      <div class="cc-head">
        <span class="cc-code">${c.code||'—'}</span>
        <div class="cc-actions">
          ${Auth.isAdmin() ? `<button class="act-btn" onclick="openEdit(${c.id})" title="Redaktə"><i class="fa-solid fa-pen"></i></button><button class="act-btn danger" onclick="delCourse(${c.id})" title="Sil"><i class="fa-solid fa-trash"></i></button>` : ''}
        </div>
      </div>
      <div class="cc-name">${c.name||'—'}</div>
      <div class="cc-desc">${c.description||'Təsvir yoxdur'}</div>
      <div class="cc-meta">
        <span class="cc-mi"><i class="fa-solid fa-star"></i> ${c.credits||0} kredit</span>
        ${c.teacherName ? `<span class="cc-mi"><i class="fa-solid fa-chalkboard-user"></i> ${c.teacherName}</span>` : ''}
      </div>
      ${Auth.isAdmin() ? `<div class="enroll-section"><button class="btn btn-success-soft btn-sm" style="width:100%" onclick="openEnroll(${c.id},'${(c.name||'').replace(/'/g,"\\'")}')"><i class="fa-solid fa-user-plus"></i> Tələbə qeydiyyatı</button></div>` : ''}
    </div>`).join('');
}

function openAdd() {
  document.getElementById('cModalTitle').textContent = 'Yeni kurs';
  document.getElementById('cId').value = '';
  document.getElementById('courseForm').reset();
  openModal('courseModal');
}
function openEdit(id) {
  const c = allCourses.find(x => x.id === id); if (!c) return;
  document.getElementById('cModalTitle').textContent = 'Kursu redaktə et';
  document.getElementById('cId').value = c.id;
  document.getElementById('cName').value = c.name || '';
  document.getElementById('cCode').value = c.code || '';
  document.getElementById('cCredits').value = c.credits || '';
  document.getElementById('cDesc').value = c.description || '';
  openModal('courseModal');
}
async function submitCourse(e) {
  e.preventDefault();
  const id = document.getElementById('cId').value;
  const body = { name: document.getElementById('cName').value.trim(), code: document.getElementById('cCode').value.trim(), credits: parseInt(document.getElementById('cCredits').value), description: document.getElementById('cDesc').value.trim() };
  const btn = document.getElementById('cSubmit'); btn.disabled = true;
  try {
    if (id) await api.courses.update(parseInt(id), body); else await api.courses.create(body);
    showToast(id ? 'Kurs yeniləndi' : 'Kurs əlavə edildi');
    closeModal('courseModal'); load();
  } catch(err) { showToast(err.message || 'Xəta', 'error'); }
  finally { btn.disabled = false; }
}
async function delCourse(id) {
  if (!confirm('Bu kursu silmək istədiyinizə əminsiniz?')) return;
  try { await api.courses.delete(id); showToast('Kurs silindi'); load(); }
  catch(e) { showToast(e.message || 'Xəta', 'error'); }
}

function openEnroll(cId, cName) {
  enrollCourseId = cId;
  document.getElementById('enrollCourseName').textContent = cName;
  const sel = document.getElementById('enrollStudentSel');
  sel.innerHTML = '<option value="">— Tələbə seçin —</option>' + allStudents.map(s => `<option value="${s.id}">${s.name||''} ${s.surname||''}</option>`).join('');
  openModal('enrollModal');
}
async function doEnroll() {
  const sId = document.getElementById('enrollStudentSel').value;
  if (!sId) { showToast('Tələbə seçin', 'warning'); return; }
  try {
    await api.enrollments.enroll(parseInt(sId), enrollCourseId);
    showToast('Tələbə kursa qeydiyyatdan keçdi');
    closeModal('enrollModal');
  } catch(e) { showToast(e.message || 'Xəta', 'error'); }
}

load();
</script>
</body>
</html>
