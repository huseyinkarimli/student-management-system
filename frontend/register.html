<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qeydiyyat — EduCore SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script>(function(){ const t=localStorage.getItem('theme'); if(t==='light') document.documentElement.setAttribute('data-theme','light'); })();</script>
  <style>
    :root{--bg:#05050a;--surface:#0d0d14;--surface2:#141420;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--accent:#7b6ef6;--accent2:#f06292;--text:#eeeef5;--text2:#9898b0;--text3:#606078;--success:#4caf82;--danger:#ef5f5f;}
    [data-theme="light"]{--bg:#f2f2f8;--surface:#ffffff;--surface2:#f8f8fc;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.14);--text:#12121e;--text2:#606080;--text3:#9898b0;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;-webkit-font-smoothing:antialiased;}
    .card{background:var(--surface);border:1px solid var(--border2);border-radius:22px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.5);}
    .back{display:inline-flex;align-items:center;gap:7px;color:var(--text2);font-size:13px;margin-bottom:30px;cursor:pointer;transition:color .15s;}
    .back:hover{color:var(--text);}
    .ch h2{font-family:'Clash Display',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
    .ch p{font-size:14px;color:var(--text2);margin-bottom:30px;}
    .fg{margin-bottom:17px;}
    .fl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:7px;}
    .input-w{position:relative;}
    .fi{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Cabinet Grotesk',sans-serif;font-size:14px;padding:11px 16px 11px 42px;border-radius:9px;outline:none;transition:border-color .2s,box-shadow .2s;}
    .fi:focus{border-color:#7b6ef6;box-shadow:0 0 0 3px rgba(123,110,246,.14);}
    .fi-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none;}
    .input-w:focus-within .fi-icon{color:#7b6ef6;}
    .tog-pass{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:4px;transition:color .2s;}
    .tog-pass:hover{color:var(--text);}
    .str-bar{height:3px;background:var(--surface2);border-radius:100px;overflow:hidden;margin-top:7px;}
    .str-fill{height:100%;border-radius:100px;width:0%;transition:width .35s,background .35s;}
    .str-txt{font-size:11px;color:var(--text3);margin-top:5px;transition:color .35s;}
    .btn-sub{width:100%;background:linear-gradient(135deg,#7b6ef6,#9b8ef8);color:#fff;font-family:'Cabinet Grotesk',sans-serif;font-size:15px;font-weight:500;border:none;border-radius:10px;padding:13px;cursor:pointer;transition:opacity .2s,box-shadow .2s;margin-top:6px;}
    .btn-sub:hover{opacity:.9;box-shadow:0 8px 28px rgba(123,110,246,.4);}
    .btn-sub:disabled{opacity:.6;cursor:not-allowed;}
    .lnk{text-align:center;margin-top:22px;font-size:14px;color:var(--text2);}
    .lnk a{color:#7b6ef6;cursor:pointer;font-weight:500;}
    .lnk a:hover{text-decoration:underline;}
    .toast-host{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
    .toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:13px 16px;min-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:ti .4s cubic-bezier(.34,1.56,.64,1);}
    .toast.success{border-color:rgba(76,175,130,.35);}
    .toast.error{border-color:rgba(239,95,95,.35);}
    .ti{font-size:14px;}.toast.success .ti{color:#4caf82;}.toast.error .ti{color:#ef5f5f;}
    .tm{font-size:13px;}
    @keyframes ti{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
    .credit{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text3);}
  </style>
</head>
<body>
<div class="card">
  <div class="back" onclick="window.location.href='login.html'">
    <i class="fa-solid fa-arrow-left"></i> Daxil olmaya qayıt
  </div>
  <div class="ch">
    <h2>Hesab yarat 🎓</h2>
    <p>EduCore SMS platformasına qoşulun</p>
  </div>
  <form id="regForm">
    <div class="fg">
      <label class="fl">İstifadəçi adı *</label>
      <div class="input-w">
        <input type="text" class="fi" id="username" placeholder="username" required minlength="3"/>
        <i class="fi-icon fa-regular fa-user"></i>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Şifrə *</label>
      <div class="input-w">
        <input type="password" class="fi" id="password" placeholder="••••••••" required minlength="6" oninput="checkStr(this.value)"/>
        <i class="fi-icon fa-solid fa-lock"></i>
        <button type="button" class="tog-pass" id="tp"><i class="fa-regular fa-eye"></i></button>
      </div>
      <div class="str-bar"><div class="str-fill" id="strBar"></div></div>
      <div class="str-txt" id="strTxt">Şifrə daxil edin</div>
    </div>
    <div class="fg">
      <label class="fl">Şifrəni təsdiqlə *</label>
      <div class="input-w">
        <input type="password" class="fi" id="password2" placeholder="••••••••" required/>
        <i class="fi-icon fa-solid fa-lock"></i>
      </div>
    </div>
    <button type="submit" class="btn-sub" id="btnSub">Qeydiyyatdan keç</button>
  </form>
  <div class="lnk">Artıq hesabınız var? <a onclick="window.location.href='login.html'">Daxil olun</a></div>
</div>
<div class="toast-host" id="toast-host"></div>
<div class="credit">@ by Huseyin Karimli</div>
<script>
  const BASE='http://localhost:8080';
  document.getElementById('tp').addEventListener('click',function(){
    const i=document.getElementById('password'),ic=this.querySelector('i');
    if(i.type==='password'){i.type='text';ic.className='fa-regular fa-eye-slash';}else{i.type='password';ic.className='fa-regular fa-eye';}
  });
  function checkStr(v){
    const b=document.getElementById('strBar'),t=document.getElementById('strTxt');
    if(!v){b.style.width='0%';t.textContent='Şifrə daxil edin';t.style.color='var(--text3)';return;}
    let s=0;
    if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
    const l=[{w:'22%',c:'#ef5f5f',tx:'Çox zəif'},{w:'45%',c:'#f6c453',tx:'Zəif'},{w:'70%',c:'#5bc4e4',tx:'Yaxşı'},{w:'100%',c:'#4caf82',tx:'Güclü'}];
    const x=l[Math.min(s,4)-1]||{w:'0%',c:'var(--text3)',tx:'Çox zəif'};
    b.style.width=x.w;b.style.background=x.c;t.textContent=x.tx;t.style.color=x.c;
  }
  function toast(msg,type='error'){
    const h=document.getElementById('toast-host');const t=document.createElement('div');t.className='toast '+type;
    const ic=type==='success'?'fa-circle-check':'fa-circle-exclamation';
    t.innerHTML=`<i class="ti fa-solid ${ic}"></i><span class="tm">${msg}</span>`;
    h.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3600);
  }
  document.getElementById('regForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value;
    const p2=document.getElementById('password2').value;
    if(p!==p2){toast('Şifrələr uyğun deyil');return;}
    const btn=document.getElementById('btnSub');
    btn.disabled=true;btn.textContent='Qeydiyyat edilir...';
    try{
      const res=await fetch(BASE+'/apis/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      if(!res.ok){const t=await res.text();throw new Error(t||'Qeydiyyat alınmadı');}
      toast('Qeydiyyat uğurlu! Daxil olun...','success');
      setTimeout(()=>window.location.href='login.html',1200);
    }catch(err){toast(err.message||'Xəta baş verdi');}
    finally{btn.disabled=false;btn.textContent='Qeydiyyatdan keç';}
  });
</script>
</body>
</html>
